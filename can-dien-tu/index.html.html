<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đọc Cân điện tử</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#16202a;--mute:#5d6b78;--line:#d5dce3;--ok:#16794a;--okbg:#dff3e8;--low:#a35a00;--lowbg:#fdecd0;--high:#b3261e;--highbg:#fbdedb;--acc:#1f4f7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--panel:#18212a;--ink:#e8eef3;--mute:#91a0ad;--line:#2b3742;--ok:#5fd39a;--okbg:#123626;--low:#f0b45a;--lowbg:#3a2b10;--high:#ff8f87;--highbg:#42201d;--acc:#7db6e8}}
:root[data-theme="dark"]{--bg:#10161c;--panel:#18212a;--ink:#e8eef3;--mute:#91a0ad;--line:#2b3742;--ok:#5fd39a;--okbg:#123626;--low:#f0b45a;--lowbg:#3a2b10;--high:#ff8f87;--highbg:#42201d;--acc:#7db6e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 22px 'Barlow Semi Condensed',sans-serif;margin:4px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
select,input,button{font:inherit;color:var(--ink)}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{padding:10px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0b1218}}
button.ghost{background:transparent;color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}.row>button{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{text-align:center;border-radius:10px;padding:18px 8px;background:var(--bg);border:2px solid var(--line)}
.read.ok{background:var(--okbg);border-color:var(--ok)}.read.low{background:var(--lowbg);border-color:var(--low)}.read.high{background:var(--highbg);border-color:var(--high)}
.num{font:700 64px/1 'Barlow Semi Condensed',sans-serif;font-variant-numeric:tabular-nums}
.num small{font-size:24px;color:var(--mute);margin-left:6px}
.state{font:700 20px 'Barlow Semi Condensed',sans-serif;margin-top:8px}
.ok .state{color:var(--ok)}.low .state{color:var(--low)}.high .state{color:var(--high)}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.conn{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.t-ok{color:var(--ok)}.t-low{color:var(--low)}.t-high{color:var(--high)}
.stats{display:flex;gap:16px;font-size:14px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.stats b{color:var(--ink)}
#msg{font-size:14px;color:var(--mute);margin-top:8px;min-height:18px}
</style>
</head>
<body>
<main>
<h1>Đọc cân điện tử</h1>

<section class="card">
  <label for="std">Mức cân chuẩn</label>
  <div class="row">
    <select id="std"></select>
    <button class="ghost" id="delStd" title="Xóa mức đang chọn">Xóa</button>
  </div>
  <div class="grid2" style="margin-top:8px">
    <div><label for="tol">Sai số cho phép (± g)</label><input id="tol" type="number" inputmode="decimal" min="0" step="any" value="5"></div>
    <div><label for="newStd">Thêm mức mới (g)</label>
      <div class="row"><input id="newStd" type="number" inputmode="decimal" min="0" step="any" placeholder="vd. 250"><button id="addStd">Thêm</button></div></div>
  </div>
</section>

<section class="card">
  <div class="read" id="read">
    <div class="num"><span id="val">--</span><small>g</small></div>
    <div class="state" id="state">Chưa có số liệu</div>
    <div class="meta" id="diff">Kết nối cân hoặc nhập tay bên dưới</div>
  </div>
  <button id="save" style="width:100%;margin-top:10px" disabled>Lưu lần cân này</button>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">Chưa kết nối cân</span></div>
</section>

<section class="card">
  <div class="grid2">
    <div><label for="baud">Tốc độ baud</label>
      <select id="baud"><option>1200</option><option>2400</option><option selected>9600</option><option>19200</option><option>115200</option></select></div>
    <div><label for="unit">Đơn vị cân gửi về</label>
      <select id="unit"><option value="g">g</option><option value="kg">kg</option></select></div>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="conn">Kết nối cân (USB/COM)</button>
    <button class="ghost" id="disc" disabled>Ngắt</button>
  </div>
  <div style="margin-top:12px"><label for="manual">Hoặc nhập số tay (g)</label>
    <div class="row"><input id="manual" type="number" inputmode="decimal" step="any" placeholder="vd. 248.6"><button class="ghost" id="useManual">Dùng số này</button></div></div>
  <div id="msg"></div>
</section>

<section class="card">
  <div class="stats"><span>Tổng: <b id="sN">0</b></span><span>Đạt: <b id="sOk">0</b></span><span>Trung bình: <b id="sAvg">--</b> g</span></div>
  <div class="tablewrap"><table>
    <thead><tr><th>Giờ</th><th>Chuẩn</th><th>Cân</th><th>Lệch</th><th>KQ</th></tr></thead>
    <tbody id="log"><tr><td colspan="5" style="text-align:center;color:var(--mute)">Chưa có lần cân nào</td></tr></tbody>
  </table></div>
  <div class="row" style="margin-top:10px">
    <button class="ghost" id="copy">Sao chép CSV</button>
    <button class="ghost" id="clear">Xóa lịch sử</button>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let stds=[100,250,500,1000], log=[], cur=null, port=null, reader=null, keepReading=false;

function load(){try{const s=JSON.parse(localStorage.getItem('can_stds')||'null');if(Array.isArray(s)&&s.length)stds=s;
 const l=JSON.parse(localStorage.getItem('can_log')||'null');if(Array.isArray(l))log=l;
 const t=localStorage.getItem('can_tol');if(t)$('tol').value=t;
 const c=localStorage.getItem('can_std');if(c)window._c=+c;}catch(e){}}
function persist(){try{localStorage.setItem('can_stds',JSON.stringify(stds));localStorage.setItem('can_log',JSON.stringify(log));
 localStorage.setItem('can_tol',$('tol').value);localStorage.setItem('can_std',$('std').value);}catch(e){}}

function fmt(n){return (Math.round(n*100)/100).toLocaleString('vi-VN')}
function renderStds(sel){stds=[...new Set(stds)].sort((a,b)=>a-b);
 $('std').innerHTML=stds.map(s=>`<option value="${s}">${fmt(s)} g</option>`).join('');
 if(sel!=null&&stds.includes(sel))$('std').value=sel;}
function judge(w){const std=+$('std').value,tol=Math.abs(+$('tol').value||0),d=w-std;
 return {std,d,res:Math.abs(d)<=tol?'ok':(d<0?'low':'high')};}
const label={ok:'ĐẠT',low:'THIẾU',high:'QUÁ'};

function render(){const r=$('read');
 if(cur==null){r.className='read';$('val').textContent='--';$('state').textContent='Chưa có số liệu';$('diff').textContent='Kết nối cân hoặc nhập tay bên dưới';$('save').disabled=true;return;}
 const j=judge(cur);r.className='read '+j.res;$('val').textContent=fmt(cur);$('state').textContent=label[j.res];
 $('diff').textContent=`Chuẩn ${fmt(j.std)} g · lệch ${j.d>0?'+':''}${fmt(j.d)} g`;$('save').disabled=false;}
function renderLog(){const tb=$('log');
 if(!log.length)tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--mute)">Chưa có lần cân nào</td></tr>';
 else tb.innerHTML=log.slice().reverse().map(e=>`<tr><td>${e.t}</td><td>${fmt(e.std)}</td><td>${fmt(e.w)}</td><td>${e.d>0?'+':''}${fmt(e.d)}</td><td class="t-${e.res}">${label[e.res]}</td></tr>`).join('');
 $('sN').textContent=log.length;$('sOk').textContent=log.filter(e=>e.res==='ok').length;
 $('sAvg').textContent=log.length?fmt(log.reduce((a,e)=>a+e.w,0)/log.length):'--';}

function setWeight(g){if(!isFinite(g))return;cur=g;render();}
function parseLine(line){const m=line.match(/([-+]?\s*\d+(?:[.,]\d+)?)\s*(kg|g)?/i);if(!m)return;
 let v=parseFloat(m[1].replace(/\s/g,'').replace(',','.'));const u=(m[2]||$('unit').value).toLowerCase();
 if(u==='kg')v*=1000;setWeight(v);}

async function connect(){
 if(!('serial' in navigator)){$('msg').textContent='Trình duyệt này không hỗ trợ cổng COM/USB. Dùng Chrome hoặc Edge trên máy tính, hoặc nhập số tay.';return;}
 try{port=await navigator.serial.requestPort();await port.open({baudRate:+$('baud').value});}
 catch(e){$('msg').textContent='Không kết nối được: '+(e.message||e.name)+'. Nếu mở trong khung nhúng, hãy mở trang ở tab riêng.';return;}
 keepReading=true;$('dot').classList.add('on');$('connTxt').textContent='Đang nhận dữ liệu từ cân';$('conn').disabled=true;$('disc').disabled=false;$('msg').textContent='';
 const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});reader=dec.readable.getReader();
 let buf='';
 try{while(keepReading){const {value,done}=await reader.read();if(done)break;buf+=value;
  const parts=buf.split(/[\r\n]+/);buf=parts.pop();parts.forEach(p=>p.trim()&&parseLine(p));}}
 catch(e){}
 await disconnect();}
async function disconnect(){keepReading=false;try{if(reader)await reader.cancel();}catch(e){}
 try{if(port)await port.close();}catch(e){}
 port=null;reader=null;$('dot').classList.remove('on');$('connTxt').textContent='Chưa kết nối cân';$('conn').disabled=false;$('disc').disabled=true;}

$('conn').onclick=connect;$('disc').onclick=disconnect;
$('useManual').onclick=()=>{const v=parseFloat($('manual').value);if(isFinite(v))setWeight(v);};
$('std').onchange=()=>{persist();render();};
$('tol').oninput=()=>{persist();render();};
$('addStd').onclick=()=>{const v=parseFloat($('newStd').value);if(!(v>0))return;stds.push(v);renderStds(v);$('newStd').value='';persist();render();};
$('delStd').onclick=()=>{if(stds.length<=1)return;stds=stds.filter(s=>s!==+$('std').value);renderStds();persist();render();};
$('save').onclick=()=>{if(cur==null)return;const j=judge(cur);
 log.push({t:new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),std:j.std,w:cur,d:j.d,res:j.res});
 if(log.length>500)log.shift();persist();renderLog();};
$('clear').onclick=()=>{log=[];persist();renderLog();};
$('copy').onclick=async()=>{const csv='Giờ,Chuẩn (g),Cân (g),Lệch (g),Kết quả\n'+log.map(e=>[e.t,e.std,e.w,e.d,label[e.res]].join(',')).join('\n');
 try{await navigator.clipboard.writeText(csv);$('msg').textContent='Đã sao chép CSV, dán vào Excel hoặc Google Sheets.';}
 catch(e){$('msg').textContent='Không sao chép được. Hãy thử lại trong tab riêng.';}};

load();renderStds(window._c);renderLog();render();
</script>
</body>
</html>
