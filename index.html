<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DỮ LIỆU CÂN ĐIỆN TỬ</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#0f6b73;--panel:#fff;--ink:#12262a;--mute:#566b70;--line:#cfe0e2;--ok:#16794a;--okbg:#dff3e8;--low:#a35a00;--lowbg:#fdecd0;--high:#b3261e;--highbg:#fbdedb;--acc:#0f6b73;--lbl:#0b4f55;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Roboto',system-ui,sans-serif;font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:900 24px 'Roboto',sans-serif;margin:4px 0 14px;color:#fff}
.card{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
label{display:block;font-size:15px;font-weight:700;color:var(--lbl);margin-bottom:5px;padding-left:8px;border-left:4px solid var(--acc)}
select,input,button{font:inherit;color:var(--ink)}
select,input{width:100%;padding:10px;border:1px solid #9bbcc0;border-radius:8px;background:#fff}
.suf{position:relative}
.suf input{padding-right:58px}
.suf span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
button{padding:10px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}.row>button{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{text-align:center;border-radius:10px;padding:18px 8px;background:#f1f7f8;border:2px solid var(--line)}
.read.ok{background:var(--okbg);border-color:var(--ok)}.read.low{background:var(--lowbg);border-color:var(--low)}.read.high{background:var(--highbg);border-color:var(--high)}
.num{font:700 56px/1 'Roboto',sans-serif;font-variant-numeric:tabular-nums}
.num small{font-size:24px;color:var(--mute);margin-left:6px}
.state{font:700 20px 'Roboto',sans-serif;margin-top:8px}
.ok .state{color:var(--ok)}.low .state{color:var(--low)}.high .state{color:var(--high)}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
#noteBox{margin-top:10px;display:none}
.conn{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+6),td:nth-child(-n+6),th:nth-child(9),td:nth-child(9){text-align:left}
th:last-child,td:last-child{text-align:left;white-space:normal;min-width:150px}
th{color:var(--lbl);font-weight:700}
.t-ok{color:var(--ok)}.t-low{color:var(--low)}.t-high{color:var(--high)}
.stats{display:flex;gap:8px 16px;font-size:15px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap;align-items:baseline}
.stats b{color:var(--ink)}
.stats .right{margin-left:auto}
#failList{display:none;margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--highbg);font-size:14px;line-height:1.5}
#failList .ttl{font-weight:700;color:var(--high);margin-bottom:2px}
#msg{font-size:14px;color:var(--mute);margin-top:8px;min-height:18px}
.tmp{border:2px dashed #e0a800}
.tmp .tag{display:inline-block;background:#fff3cd;color:#7a5b00;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>DỮ LIỆU CÂN ĐIỆN TỬ</h1>

<section class="card">
  <div class="grid2">
    <div><label for="pName">Tên sản phẩm</label><input id="pName" type="text" autocapitalize="characters" autocomplete="off" placeholder="vd. FLOSAL D"></div>
    <div><label for="pLine">Line hàng</label><input id="pLine" type="text" autocapitalize="characters" autocomplete="off" placeholder="vd. UY-01"></div>
  </div>
  <div class="grid2" style="margin-top:8px">
    <div><label for="pLot">Số lô</label><input id="pLot" type="text" autocapitalize="characters" autocomplete="off" placeholder="vd. 2611M01"></div>
    <div><label for="pMfg">NSX (ngày sản xuất)</label><input id="pMfg" type="date"></div>
  </div>
  <div class="grid2" style="margin-top:8px">
    <div><label for="pForm">Dạng bào chế</label>
      <select id="pForm"><option value="Bột" selected>Bột</option><option value="Nước">Nước</option><option value="Tiêm">Tiêm</option></select></div>
  </div>
  <div class="grid2" style="margin-top:8px">
    <div><label for="pUnit">Đơn vị tính</label>
      <select id="pUnit"><option value="thùng" selected>Thùng</option><option value="bao">Bao</option><option value="hộp">Hộp</option></select></div>
    <div><label for="pPer" id="perLabel">Số lượng trên 1 (thùng)</label>
      <div class="suf"><input id="pPer" type="number" inputmode="numeric" min="0" step="any" placeholder="vd. 24"><span id="perSuf">túi</span></div></div>
  </div>
</section>

<section class="card">
  <div class="grid2">
    <div><label for="std">Khối lượng chuẩn</label>
      <div class="suf"><input id="std" type="text" inputmode="decimal" placeholder="vd. 0,250"><span>kg</span></div></div>
    <div><label for="tol">Sai số cho phép (± g)</label>
      <select id="tol"><option value="10">10 g</option><option value="20">20 g</option><option value="30">30 g</option></select></div>
  </div>
</section>

<section class="card">
  <div class="read" id="read">
    <div class="num"><span id="val">--</span><small>kg</small></div>
    <div class="state" id="state">Chưa có số liệu</div>
    <div class="meta" id="diff">Kết nối cân, rồi bấm in trên cân để lưu</div>
  </div>
  <div id="noteBox">
    <label for="note">Ghi chú (kết quả không đạt)</label>
    <input id="note" type="text" placeholder="vd. Cân lại lần 2, bao rách...">
    <div style="margin-top:8px">
      <label for="le">Số lượng lẻ</label>
      <div class="suf"><input id="le" type="number" inputmode="numeric" min="0" step="any" placeholder="vd. 7"><span id="leSuf">túi</span></div>
    </div>
  </div>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">Chưa kết nối cân</span></div>
</section>

<section class="card">
  <div>
    <label for="baud">Tốc độ baud</label>
    <select id="baud"><option>1200</option><option>2400</option><option selected>9600</option><option>19200</option><option>115200</option></select>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="conn">Kết nối cân (USB/COM)</button>
    <button class="ghost" id="disc" disabled>Ngắt</button>
  </div>
  <div id="msg"></div>
</section>

<!-- TẠM THỜI: nhập khối lượng tay để xem thử. Muốn bỏ thì xóa cả khối section này -->
<section class="card tmp" id="manualCard">
  <span class="tag">TẠM THỜI - để xem thử kết quả</span>
  <label for="manual">Nhập khối lượng tay</label>
  <div class="row">
    <div class="suf"><input id="manual" type="text" inputmode="decimal" placeholder="vd. 0,255"><span>kg</span></div>
    <button id="useManual">Lưu số này</button>
  </div>
</section>
<!-- HẾT PHẦN TẠM THỜI -->

<section class="card">
  <div class="stats">
    <span>Tổng: <b id="sN">0</b></span>
    <span>Đạt: <b id="sOk">0</b></span>
    <span>Không đạt: <b id="sBad">0</b></span>
    <span class="right">Tổng số lượng: <b id="sQty">0</b></span>
  </div>
  <div id="failList"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>STT</th><th>Giờ</th><th>Sản phẩm</th><th>Line</th><th>Lô</th><th>NSX</th><th>Số lượng</th><th>Khối lượng (Kg)</th><th>KQ</th><th>Ghi chú</th></tr></thead>
    <tbody id="log"><tr><td colspan="10" style="text-align:center;color:var(--mute)">Chưa có lần cân nào</td></tr></tbody>
  </table></div>
  <div class="row" style="margin-top:10px">
    <button class="ghost" id="copy">Sao chép CSV</button>
    <button class="ghost" id="clear">Xóa lịch sử</button>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const FIELDS=['pName','pLine','pLot','pMfg','pUnit','pForm','pPer'];
const UPPER=['pName','pLine','pLot'];
const UNITS=['thùng','bao','hộp'], FORMS=['Bột','Nước','Tiêm'];
let log=[], cur=null, port=null, reader=null, keepReading=false, lastKey='', lastAt=0, lastIdx=-1;

function subOf(form){return form==='Bột'?'túi':'chai'}
function syncUnits(){const u=$('pUnit').value,s=subOf($('pForm').value);
 $('perLabel').textContent='Số lượng trên 1 ('+u+')';$('perSuf').textContent=s;$('leSuf').textContent=s;}

// Tự động chuyển chữ in hoa (giữ nguyên vị trí con trỏ)
function upper(el){const v=el.value.toUpperCase();if(v===el.value)return;
 const s=el.selectionStart,e=el.selectionEnd;el.value=v;try{el.setSelectionRange(s,e)}catch(x){}}

function load(){try{
 const l=JSON.parse(localStorage.getItem('can_log2')||'null');if(Array.isArray(l))log=l;
 const t=localStorage.getItem('can_tol');if(['10','20','30'].includes(t))$('tol').value=t;
 const c=localStorage.getItem('can_std2');if(c)$('std').value=c;
 FIELDS.forEach(k=>{const v=localStorage.getItem('can_'+k);if(!v)return;
  if(k==='pUnit'&&!UNITS.includes(v))return;if(k==='pForm'&&!FORMS.includes(v))return;$(k).value=v;});
 UPPER.forEach(k=>upper($(k)));}catch(e){}}
function persist(){try{localStorage.setItem('can_log2',JSON.stringify(log));
 localStorage.setItem('can_tol',$('tol').value);localStorage.setItem('can_std2',$('std').value);
 FIELDS.forEach(k=>localStorage.setItem('can_'+k,$(k).value));}catch(e){}}

function fmt3(n){return Number(n).toLocaleString('vi-VN',{minimumFractionDigits:3,maximumFractionDigits:3})}
function getStd(){const v=parseFloat(String($('std').value||'').replace(',','.'));return isFinite(v)&&v>0?v:0}
function judge(w){const std=getStd(),tol=(+$('tol').value||0)/1000,d=Math.round((w-std)*1000)/1000;
 return {std,d,res:Math.abs(d)<=tol+1e-9?'ok':(d<0?'low':'high')};}
const label={ok:'ĐẠT',low:'THIẾU',high:'DƯ'};
function fd(s){return s?s.split('-').reverse().join('/'):''}
// Số lượng của 1 dòng: thùng ĐẠT lấy theo "Số lượng trên 1 (...)", thùng KHÔNG ĐẠT lấy theo "Số lượng lẻ" trong ghi chú
function qtyOf(e){return e.res==='ok'?(+e.per||0):(+e.le||0)}
function qtyText(e){const v=e.res==='ok'?e.per:e.le;if(v===''||v==null)return '';return Number(v).toLocaleString('vi-VN')+' '+subOf(e.form)}
function noteText(e){const p=[];if(e.note)p.push(e.note);if(e.le)p.push('Lẻ: '+e.le+' '+subOf(e.form));return p.join(' · ')}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(saved){const r=$('read');
 if(cur==null){r.className='read';$('val').textContent='--';$('state').textContent='Chưa có số liệu';$('diff').textContent='Kết nối cân, rồi bấm in trên cân để lưu';return;}
 if(!getStd()){r.className='read';$('val').textContent=fmt3(cur);$('state').textContent='Nhập khối lượng chuẩn';$('diff').textContent='Chưa lưu: điền ô Khối lượng chuẩn phía trên';return;}
 const j=judge(cur);r.className='read '+j.res;$('val').textContent=fmt3(cur);$('state').textContent=label[j.res];
 $('diff').textContent=`Chuẩn ${fmt3(j.std)} kg · lệch ${j.d>0?'+':''}${fmt3(j.d)} kg`+(saved?' · đã lưu':'');}

function renderLog(){const tb=$('log');
 if(!log.length)tb.innerHTML='<tr><td colspan="10" style="text-align:center;color:var(--mute)">Chưa có lần cân nào</td></tr>';
 else tb.innerHTML=log.map((e,i)=>`<tr><td>${i+1}</td><td>${e.t}</td><td>${esc(e.name)}</td><td>${esc(e.line)}</td><td>${esc(e.lot)}</td><td>${fd(e.mfg)}</td><td>${esc(qtyText(e))}</td><td>${fmt3(e.w)}</td><td class="t-${e.res}">${label[e.res]}</td><td>${esc(noteText(e))}</td></tr>`).reverse().join('');
 const u=$('pUnit').value,sub=subOf($('pForm').value);
 const n=log.length,ok=log.filter(e=>e.res==='ok').length,bad=n-ok;
 let tot=0;log.forEach(e=>{tot+=qtyOf(e);});
 $('sN').textContent=n+' '+u;$('sOk').textContent=ok+' '+u;$('sBad').textContent=bad+' '+u;
 $('sQty').textContent=tot.toLocaleString('vi-VN')+' '+sub;
 const fl=$('failList'),bl=log.map((e,i)=>({e,i})).filter(x=>x.e.res!=='ok');
 if(!bl.length){fl.style.display='none';fl.innerHTML='';}
 else{fl.style.display='block';
  fl.innerHTML='<div class="ttl">Chi tiết '+u+' không đạt</div>'+bl.map(x=>`<div><b>STT ${x.i+1}</b> · <span class="t-${x.e.res}">${label[x.e.res]}</span> · ${x.e.note?esc(x.e.note):'<i>chưa có ghi chú</i>'}${x.e.le?` · Số lượng lẻ: <b>${esc(x.e.le)} ${subOf(x.e.form)}</b>`:''}</div>`).join('');}}

function onScale(kg){if(!isFinite(kg))return;cur=Math.round(kg*1000)/1000;
 if(!getStd()){render(false);return;}
 const key=cur+'|'+getStd(),now=Date.now();
 if(key===lastKey&&now-lastAt<1000){render(true);return;}
 lastKey=key;lastAt=now;
 const j=judge(cur);
 log.push({t:new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),std:j.std,w:cur,d:j.d,res:j.res,name:$('pName').value.trim().toUpperCase(),line:$('pLine').value.trim().toUpperCase(),lot:$('pLot').value.trim().toUpperCase(),mfg:$('pMfg').value,unit:$('pUnit').value,form:$('pForm').value,per:$('pPer').value.trim(),note:'',le:''});
 if(log.length>500)log.shift();
 lastIdx=log.length-1;
 $('note').value='';$('le').value='';$('noteBox').style.display=j.res==='ok'?'none':'block';
 persist();renderLog();render(true);}
function parseLine(line){const m=line.match(/([-+]?\s*\d+(?:[.,]\d+)?)\s*(kg|g)?/i);if(!m)return;
 let v=parseFloat(m[1].replace(/\s/g,'').replace(',','.'));const u=(m[2]||'kg').toLowerCase();
 if(u==='g')v/=1000;onScale(v);}

async function connect(){
 if(!('serial' in navigator)){$('msg').textContent='Trình duyệt này không hỗ trợ cổng COM/USB. Dùng Chrome hoặc Edge trên máy tính.';return;}
 try{port=await navigator.serial.requestPort();await port.open({baudRate:+$('baud').value});}
 catch(e){$('msg').textContent='Không kết nối được: '+(e.message||e.name)+'. Nếu mở trong khung nhúng, hãy mở trang ở tab riêng.';return;}
 keepReading=true;$('dot').classList.add('on');$('connTxt').textContent='Đang nhận dữ liệu từ cân';$('conn').disabled=true;$('disc').disabled=false;$('msg').textContent='';
 const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});reader=dec.readable.getReader();
 let buf='';
 try{while(keepReading){const {value,done}=await reader.read();if(done)break;buf+=value;
  const parts=buf.split(/[\r\n]+/);buf=parts.pop();parts.forEach(p=>p.trim()&&parseLine(p));}}
 catch(e){}
 await disconnect();}
async function disconnect(){keepReading=false;try{if(reader)await reader.cancel();}catch(e){}
 try{if(port)await port.close();}catch(e){}
 port=null;reader=null;$('dot').classList.remove('on');$('connTxt').textContent='Chưa kết nối cân';$('conn').disabled=false;$('disc').disabled=true;}

$('conn').onclick=connect;$('disc').onclick=disconnect;
$('std').oninput=()=>{persist();if(cur!=null)render(false);};
$('tol').onchange=()=>{persist();if(cur!=null)render(false);};
function updNote(){if(lastIdx>=0&&log[lastIdx]){log[lastIdx].note=$('note').value.trim();log[lastIdx].le=$('le').value.trim();persist();renderLog();}}
$('note').oninput=updNote;$('le').oninput=updNote;
$('clear').onclick=()=>{log=[];lastIdx=-1;$('noteBox').style.display='none';persist();renderLog();};
$('copy').onclick=async()=>{const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';const n=x=>Number(x).toFixed(3);
 const csv='STT,Giờ,Sản phẩm,Line hàng,Số lô,NSX,Số lượng,Khối lượng (Kg),Kết quả,Ghi chú\n'+log.map((e,i)=>[i+1,e.t,q(e.name),q(e.line),q(e.lot),fd(e.mfg),q(qtyText(e)),n(e.w),label[e.res],q(noteText(e))].join(',')).join('\n');
 try{await navigator.clipboard.writeText(csv);$('msg').textContent='Đã sao chép CSV, dán vào Excel hoặc Google Sheets.';}
 catch(e){$('msg').textContent='Không sao chép được. Hãy thử lại trong tab riêng.';}};

FIELDS.forEach(k=>{$(k).oninput=persist;$(k).onchange=persist;});
// Ô Tên sản phẩm, Line hàng, Số lô: tự động in hoa (bỏ qua khi đang gõ dấu tiếng Việt để không làm hỏng bộ gõ)
UPPER.forEach(k=>{const el=$(k);
 el.oninput=ev=>{if(!ev.isComposing)upper(el);persist();};
 el.addEventListener('compositionend',()=>{upper(el);persist();});});
['change','input'].forEach(ev=>{$('pUnit').addEventListener(ev,()=>{syncUnits();persist();renderLog();});$('pForm').addEventListener(ev,()=>{syncUnits();persist();renderLog();});});

// TẠM THỜI: nhập khối lượng tay (xóa khối này cùng với section "manualCard" khi không cần nữa)
$('useManual').onclick=()=>{const v=parseFloat(String($('manual').value||'').replace(',','.'));if(!isFinite(v)||v<=0)return;lastKey='';onScale(v);};
// HẾT PHẦN TẠM THỜI

load();syncUnits();renderLog();render(false);
</script>
</body>
</html>
